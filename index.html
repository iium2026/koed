<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Link Hub</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--muted:#677084;--line:#e4e7ec;--accent:#0f766e;--accent-ink:#fff;--soft:#e6f4f2;--radius:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1317;--panel:#171c22;--text:#e8ebef;--muted:#9099a8;--line:#262d36;--accent:#2dd4bf;--accent-ink:#06201d;--soft:#12302d;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}
.icon-btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:18px}
#menuBtn{display:none}
#search{flex:1 1 240px;max-width:420px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:transparent;padding:8px 11px}
.seg button.on{background:var(--soft);color:var(--accent);font-weight:600}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 14px;font-weight:600;text-decoration:none;text-align:center;display:block}
#demo{background:var(--soft);color:var(--accent);padding:6px 14px;font-size:13px;text-align:center}

/* layout */
.app{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 340px}
#side,main,#detail{overflow:auto}
#side{background:var(--panel);border-right:1px solid var(--line);padding:10px 8px}
main{padding:14px 16px}
#detail{background:var(--panel);border-left:1px solid var(--line);padding:18px}
#scrim{display:none}

/* tree */
#tree ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:2px;padding-left:calc(var(--d) * 14px);border-radius:8px}
.row:hover{background:var(--bg)}
.row.active{background:var(--soft)}
.row.active .lbl{color:var(--accent);font-weight:600}
.caret{width:26px;height:30px;border:0;background:none;color:var(--muted);transition:transform .15s;font-size:16px;flex:none}
.caret.open{transform:rotate(90deg)}
span.caret{display:inline-block}
.lbl{flex:1;text-align:left;border:0;background:none;padding:6px 4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:12px;color:var(--muted);padding:0 8px}

/* gallery */
.crumb{color:var(--muted);font-size:13px;margin-bottom:12px}
.crumb b{color:var(--text)}
#gallery.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
#gallery.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--accent);outline:2px solid var(--accent)}
.cover{height:92px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:26px;letter-spacing:1px}
.cbody{padding:12px;min-width:0}
.ctitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--soft);color:var(--accent);border-radius:999px;padding:2px 9px;font-size:12px}
#gallery.list .card{display:flex}
#gallery.list .cover{width:76px;height:auto;flex:none;font-size:20px}
#gallery.list .cbody{flex:1}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 10px}

/* detail */
#detail h2{margin:0 0 4px;font-size:19px}
#detail .path{color:var(--muted);font-size:13px;margin-bottom:6px}
dl{display:grid;grid-template-columns:84px 1fr;gap:10px 8px;margin:16px 0}
dt{color:var(--muted)}
dd{margin:0;font-weight:500}
.verified{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.actions{display:flex;flex-direction:column;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px}
#closeDetail{display:none;float:right}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:92dvh;background:var(--panel);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{padding:20px;display:grid;gap:12px}
form h2{margin:0;font-size:18px}
label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted)}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#formMsg{min-height:20px;font-size:13px}
.err{color:#dc2626}
.okmsg{color:var(--accent)}
.formbtns{display:flex;gap:8px;justify-content:flex-end}
#subjInfo{margin-bottom:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(30px);background:#1b1f24;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14px}
#toast.on{opacity:1;transform:translateX(-50%)}

/* tablet: sidebar becomes a drawer, detail stays on the right */
@media (max-width:959px){
  .app{grid-template-columns:minmax(0,1fr) 300px}
  #menuBtn{display:grid}
  #side{position:fixed;inset:0 auto 0 0;width:min(300px,85vw);z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
}
/* phone: single column, detail becomes a bottom sheet */
@media (max-width:639px){
  .app{grid-template-columns:minmax(0,1fr)}
  #search{order:5;flex-basis:100%;max-width:none}
  #gallery.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  #detail{position:fixed;left:0;right:0;bottom:0;max-height:78dvh;border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;z-index:25;transform:translateY(105%);transition:transform .22s;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
  #detail.open{transform:none}
  #closeDetail{display:grid}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <button id="menuBtn" class="icon-btn" aria-label="Open folders">☰</button>
  <h1>Class Link Hub</h1>
  <input id="search" type="search" placeholder="Search groups, lecturers, venues…" aria-label="Search">
  <div class="seg" id="layoutToggle" role="group" aria-label="Gallery layout">
    <button data-l="grid" title="Grid">▦</button>
    <button data-l="list" title="List">☰</button>
  </div>
  <button id="addBtn" class="primary">+ Add link</button>
</header>
<div id="demo" hidden>Demo mode: sample data only. Set API_URL in index.html to connect your Google Sheet.</div>

<div class="app">
  <aside id="side"><nav id="tree" aria-label="Subjects"></nav></aside>
  <main>
    <div id="crumb" class="crumb"></div>
    <div id="gallery" class="grid"><p class="empty">Loading…</p></div>
  </main>
  <aside id="detail"></aside>
</div>
<div id="scrim"></div>

<dialog id="addDlg">
  <form id="addForm" autocomplete="off">
    <h2>Add a WhatsApp group link</h2>
    <label>Subject
      <select class="field" name="key" id="subjectSel" required>
        <option value="">Loading subjects…</option>
      </select>
      <span class="hint">Only subjects that don't have a link yet are shown.</span>
    </label>
    <div id="subjInfo" class="verified" hidden></div>
    <label>WhatsApp link
      <input class="field" name="link" type="url" required maxlength="200" placeholder="https://chat.whatsapp.com/…">
    </label>
    <label>Your name (optional, only the admin sees it)
      <input class="field" name="added_by" maxlength="40">
    </label>
    <div class="hp" aria-hidden="true"><label>Website <input name="website" tabindex="-1" autocomplete="off"></label></div>
    <div id="formMsg" role="status"></div>
    <div class="formbtns">
      <button type="button" class="btn" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary" id="submitBtn">Submit</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status"></div>
